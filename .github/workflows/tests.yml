name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: blindem
      DB_USERNAME: blindem
      DB_PASSWORD: blindem

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blindem
          POSTGRES_PASSWORD: blindem
          POSTGRES_DB: blindem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blindem -d blindem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, pdo_pgsql, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create the test database
        run: psql -h 127.0.0.1 -U blindem -d blindem -v ON_ERROR_STOP=1 -c 'CREATE DATABASE blindem_test OWNER blindem;'
        env:
          PGPASSWORD: blindem

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
